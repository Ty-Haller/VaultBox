<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;750&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 640px;
      overflow: hidden;
      background: #111b24;
      font-family: Inter, "Noto Sans", "Liberation Sans", sans-serif;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 640px;
      gap: 44px;
    }
    .mark {
      width: 176px;
      height: 176px;
      border-radius: 40px;
      display: block;
    }
    h1 {
      margin: 0;
      color: #ffffff;
      font-size: 76px;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    p {
      margin: 18px 0 0;
      color: #e8b923;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.32em;
    }
  </style>
</head>
<body>
  <div class="row">
    <img class="mark" src="logo.png" alt="">
    <div>
      <h1>VaultBox</h1>
      <p>HARD ASSET INVENTORY</p>
    </div>
  </div>
</body>
</html>
